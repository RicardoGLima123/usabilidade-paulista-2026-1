<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Div onde o React será renderizado -->
    <div id="root"></div>
    <!-- Bibliotecas do React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script> 
    <!-- React DOM  faz a ponte entre o react e o DOM do navegador-->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para transpilar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>    
    <script src="https://unpkg.com/styled-components/dist/styled-components.min.js"></script>
    
    <script type="text/babel">
        // const estilo = {
        //     color: 'red',
        //     fontSize: '20px',
        //     backgroundColor: 'lightgray',
        //     padding: '10px',
        // };
        // const titulo = styled.h1`
        //     color: red;
        //     font-size: 20px;
        //     background-color: lightgray;
        //     padding: 10px;
        // `;

        function ListaComDescricao (){
            const item1 = [
            {id: 1, titulo: 'Título 1', descricao: 'Descrição do item 1'},
            {id: 2, titulo: 'Título 2', descricao: 'Descrição do item 2'},
            {id: 3, titulo: 'Título 3', descricao: 'Descrição do item 3'}];
        
        return (
            <dl>
                {item1.map(item => (
                    <React.Fragment key="{item.id}">
                        <dt>{item.titulo}</dt>
                        <dd>{item.descricao}</dd>
                    </React.Fragment>
                ))}
            </dl>
        );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ListaComDescricao />
        );

</script>
    
</body>
</html>
